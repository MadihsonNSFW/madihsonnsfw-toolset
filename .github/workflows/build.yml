# Build the app on all three platforms.
#
# PyInstaller CANNOT cross-compile: a macOS bundle can only be produced on
# macOS and a Linux binary on Linux. That is the whole reason this file exists.
# Every job runs the SAME recipe (tools/build_app.py) so the three cannot drift.
#
# It is also the only place this port is ever TESTED. There is no Mac and no
# Linux machine in this project, so `app_platform_test.py` asks the code what it
# would do on a faked sys.platform; these runners are what actually run it.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read         # the release job asks for more, where it is needed

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false     # one platform failing must not hide the other two
      matrix:
        include:
          # ⚠ ubuntu-22.04, NOT ubuntu-latest. A PyInstaller bundle links the
          # runner's glibc, so building on 24.04 produces something that will
          # not start on older distros. Build on the OLDEST release we intend
          # to support and it runs on everything newer.
          - os: ubuntu-22.04
            label: linux
            artifact: linux-x86_64
          - os: windows-latest
            label: windows
            artifact: windows-x86_64
          # macos-13 is the last Intel runner; macos-14 is Apple Silicon.
          # A build is arch-specific, so both are produced rather than
          # pretending one covers the other.
          - os: macos-13
            label: macos-intel
            artifact: macos-x86_64
          - os: macos-14
            label: macos-arm
            artifact: macos-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # ⚠ PySide6 will not even IMPORT on a bare Ubuntu runner. There is no
      # display and no X libraries, and `QT_QPA_PLATFORM=offscreen` does not
      # remove the link-time dependencies — the failure is an ImportError about
      # libEGL, which reads like a broken install rather than a missing package.
      #
      # ⚠ `libpulse0` is on this list for the same reason and cost the first
      # run: QtMultimedia links it, so EVERY suite that imports the app died
      # on `ImportError: libpulse.so.0`, offscreen and with no audio in sight.
      # It is a LINK-time dependency of the module — importing is enough to
      # need it. (If audio is ever actually exercised here, Qt's PulseAudio
      # backend plugin also wants `libpulse-mainloop-glib0`; import does not.)
      - name: Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libpulse0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install -r app/requirements-dev.txt

      # The app-side suites, on a REAL machine of this platform. This is the
      # step that turns "we think it is portable" into "it ran".
      - name: App-side suites
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: python tools/ci_suites.py

      # ⚠ --no-dev: without it the build copies the LOCAL config.json beside
      # the binary, and that file carries a library path from whatever machine
      # made it. On a runner it would be nonsense; in a release it relocates
      # whoever unzips it.
      - name: Build
        run: python tools/build_app.py --no-dev

      - name: Verify the build contains this source
        run: python tools/verify_exe.py

      # ⚠ THREE DIFFERENT ZIP TOOLS, ON PURPOSE — this is not a place to be
      # clever with one cross-platform command.
      #  * macOS: `ditto` is the only one that preserves a .app bundle
      #    correctly. The bundle is full of SYMLINKS (Contents/Frameworks) and
      #    carries resource forks; a plain zip flattens them and the extracted
      #    app will not launch.
      #  * Windows: the runner image has no `zip` on PATH. Compress-Archive is
      #    always there.
      #  * Linux: `zip -y` keeps symlinks rather than following them.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd "app/dist"
          ditto -c -k --sequesterRsrc --keepParent \
            "MadihsonNSFW Toolset.app" \
            "$GITHUB_WORKSPACE/MadihsonNSFW-Toolset-${{ matrix.artifact }}.zip"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "app/dist/MadihsonNSFW Toolset" `
            -DestinationPath "MadihsonNSFW-Toolset-${{ matrix.artifact }}.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cd "app/dist"
          zip -ry "$GITHUB_WORKSPACE/MadihsonNSFW-Toolset-${{ matrix.artifact }}.zip" \
            "MadihsonNSFW Toolset"

      - uses: actions/upload-artifact@v4
        with:
          name: MadihsonNSFW-Toolset-${{ matrix.artifact }}
          path: MadihsonNSFW-Toolset-${{ matrix.artifact }}.zip
          if-no-files-found: error

  release:
    name: attach to the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # only this job writes, and only on a tag
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          fail_on_unmatched_files: true
